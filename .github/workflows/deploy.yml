# Build Hexo from `source` and publish static site to `main` (GitHub Pages).
# Theme note: themes/hexo-theme-ZenMind must be a real directory in the repo
# (vendored). A bare gitlink without .gitmodules will leave CI with an empty theme.
name: Build and Deploy Hexo

on:
  push:
    branches: [source]
    paths:
      - "source/**"
      - "themes/**"
      - "_config.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ZenMind theme present
        run: |
          if [ ! -f themes/hexo-theme-ZenMind/_config.yml ]; then
            echo "::error::themes/hexo-theme-ZenMind is missing or still a gitlink."
            echo "Vendor the theme into this repo (replace the gitlink with real files) before CI can build."
            ls -la themes || true
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate site
        run: |
          npx hexo clean
          npx hexo generate
          test -f public/index.html
          echo "hexo.ismyh.cn" > public/CNAME

      - name: Deploy to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./public
          cname: hexo.ismyh.cn
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Site updated from ${{ github.sha }}"
          # Keep orphan-style history shallow enough; force_orphan can be enabled if main gets huge.
          # force_orphan: true
